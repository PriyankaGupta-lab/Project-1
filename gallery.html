<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .contact-card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .info-box {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }

        .info-box h3 {
            color: #3498db;
            margin-bottom: 10px;
        }

        .info-box p {
            color: #555;
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        .submit-btn,
        .home-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .submit-btn {
            background: #3498db;
            color: white;
        }

        .submit-btn:hover {
            background: #2980b9;
        }

        .home-container {
            text-align: center;
            margin-top: 25px;
        }

        .home-btn {
            background: #2c3e50;
            color: white;
        }

        .home-btn:hover {
            background: #1a252f;
        }

        @media (max-width: 700px) {
            .contact-info {
                grid-template-columns: 1fr;
            }

            .contact-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="contact-card">

            <h1>Contact Us</h1>
            <p class="intro">
                We'd love to hear from you! Get in touch with us using the information below.
            </p>

            <!-- Dummy Contact Information -->
            <div class="contact-info">

                <div class="info-box">
                    <h3>📍 Address</h3>
                    <p>
                        123 Main Street<br>
                        New Delhi, India<br>
                        110001
                    </p>
                </div>

                <div class="info-box">
                    <h3>📞 Phone</h3>
                    <p>
                        +91 98765 43210<br>
                        +91 11 1234 5678
                    </p>
                </div>

                <div class="info-box">
                    <h3>✉ Email</h3>
                    <p>
                        info@example.com<br>
                        support@example.com
                    </p>
                </div>

            </div>

            <!-- Contact Form -->
            <form onsubmit="submitForm(event)">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your name" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message"
                              placeholder="Enter your message" required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Send Message
                </button>
            </form>

            <!-- Back to Home Button -->
            <div class="home-container">
                <a href="index.html" class="home-btn">
                    ← Back to Home
                </a>
            </div>

        </div>
    </div>

    <script>
        function submitForm(event) {
            event.preventDefault();
            alert("Thank you for contacting us! This is a demo form.");
        }
    </script>

</body>
</html>
